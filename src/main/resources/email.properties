# Cấu hình gửi Email qua Gmail SMTP
# Lưu ý: Với Gmail, bạn cần bật Xác thực 2 bước (2-Step Verification) và tạo 'Mật khẩu ứng dụng' (App Password)
# Xem hướng dẫn: https://support.google.com/accounts/answer/185833
mail.smtp.host=smtp.gmail.com
mail.smtp.port=587
mail.smtp.auth=true
mail.smtp.starttls.enable=true
mail.sender=example.test.iotstar@gmail.com
mail.password=your_app_password_here
